<path d="M472,46 L480,46 L480,158 L472,158" fill="none" stroke="#888" stroke-width="1.5"/>
<text class="rlbl" x="391" y="176" text-anchor="middle">&#8225;</text>
<path d="M370,116 Q360,88 350,82" fill="none" stroke="#1060A0" stroke-width="1.5" marker-end="url(#curl)"/>
<path d="M418,116 Q426,104 436,113" fill="none" stroke="#C03020" stroke-width="1.5" marker-end="url(#curl)"/>

<!-- SECOND ARROW -->
<line x1="496" y1="122" x2="546" y2="122" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- PRODUCT -->
<text class="rlbl" x="610" y="28" text-anchor="middle">Biradical</text>
