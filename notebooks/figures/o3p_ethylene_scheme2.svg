<circle cx="439" cy="113" r="2.5" fill="#C03020"/>
<text class="rsml" x="334" y="100" text-anchor="middle">H</text>
<line x1="342" y1="104" x2="353" y2="114" stroke="#222" stroke-width="1.2"/>
<text class="rsml" x="334" y="152" text-anchor="middle">H</text>
