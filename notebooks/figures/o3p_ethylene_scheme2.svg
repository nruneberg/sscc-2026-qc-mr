<svg width="800" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="curl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  .rlbl { font-family: sans-serif; font-size: 12px; fill: #666; }
  .ratm { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #222; }
  .rsml { font-family: sans-serif; font-size: 11px; fill: #555; }
</style>

<!-- background -->
<rect width="680" height="380" fill="white"/>

<!-- REACTANTS -->
