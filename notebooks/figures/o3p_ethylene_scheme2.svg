<text class="rsml" x="104" y="152" text-anchor="middle">H</text>
<line x1="112" y1="148" x2="122" y2="132" stroke="#222" stroke-width="1.2"/>
<text class="rsml" x="216" y="100" text-anchor="middle">H</text>
