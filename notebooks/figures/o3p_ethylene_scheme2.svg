<line x1="646" y1="146" x2="638" y2="130" stroke="#222" stroke-width="1.2"/>

<!-- LEGEND -->
<line x1="40" y1="318" x2="80" y2="318" stroke="#999" stroke-width="1.5" stroke-dasharray="4 2"/>
<text class="rsml" x="88" y="322">Partial / forming or breaking bond</text>
<circle cx="55" cy="346" r="3" fill="#C03020"/>
<text class="rsml" x="88" y="350">Radical on carbon</text>
<circle cx="55" cy="370" r="3" fill="#444"/>
<text class="rsml" x="88" y="374">Radical on oxygen</text>
<path d="M360,336 Q370,326 380,333" fill="none" stroke="#1060A0" stroke-width="1.5" marker-end="url(#curl)"/>
