<text class="rsml" x="216" y="152" text-anchor="middle">H</text>
<line x1="208" y1="148" x2="198" y2="132" stroke="#222" stroke-width="1.2"/>

<!-- REACTION ARROW -->
<line x1="240" y1="122" x2="300" y2="122" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

