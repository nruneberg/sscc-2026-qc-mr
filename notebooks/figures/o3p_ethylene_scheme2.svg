<line x1="134" y1="118" x2="186" y2="118" stroke="#222" stroke-width="1.5"/>
<line x1="134" y1="126" x2="186" y2="126" stroke="#222" stroke-width="1.5"/>
<text class="ratm" x="130" y="126" text-anchor="middle" dominant-baseline="central">C</text>
<text class="ratm" x="190" y="126" text-anchor="middle" dominant-baseline="central">C</text>
<text class="rsml" x="104" y="100" text-anchor="middle">H</text>
